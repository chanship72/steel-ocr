<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국선급 표 2.1.6 · 질의 비교</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header><div class="wrap mast"><span>한국선급 2025 · 제2편 재료 및 용접</span></div></header>
<main class="wrap">
  <h1>표 2.1.6 질의 비교</h1>
  <figure>
    <a href="/table.png" target="_blank" rel="noopener"><img src="/table.png" alt="한국선급 표 2.1.6 탈산방법 및 화학성분과 비고 원문"></a>
    <figcaption>탈산방법 및 화학성분(%) · PDF 17쪽 · 이미지를 열면 확대할 수 있습니다.</figcaption>
  </figure>
  <section class="controls" aria-label="질의 선택">
    <label for="case">검증 질의</label>
    <select id="case" disabled></select>
    <p id="question"></p>
    <p id="status" role="status"></p>
  </section>
  <div id="results" hidden>
    <h2>실시간 계산</h2>
    <div class="compare">
      <article><h3>온톨로지 추론 없이</h3><strong id="baseline"></strong><p id="baseline-context"></p></article>
      <article class="accent"><h3>온톨로지 + Z3</h3><strong id="inferred"></strong><p id="inferred-context"></p></article>
    </div>
    <p class="muted" id="expected"></p>
    <h2>저장된 LLM 응답</h2>
    <div class="compare">
      <article><h3>LLM 파싱 컨텍스트</h3><pre id="llm"></pre></article>
      <article class="accent"><h3>LLM 파싱 컨텍스트 + 추론 결과</h3><pre id="llm_ontology"></pre></article>
    </div>
    <h2>실행 상세</h2>
    <ol id="steps" class="steps"></ol>
    <details open><summary>실제로 Z3에 전달한 SMT-LIB</summary><pre id="smt"></pre></details>
    <details><summary>터미널 재현 명령 · PowerShell</summary><pre id="command"></pre></details>
  </div>
</main>
</body>
</html>
